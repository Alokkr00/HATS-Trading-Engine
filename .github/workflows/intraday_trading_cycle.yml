name: Automated Intraday Trading Cycle (Hourly)

on:
  # Runs every hour strictly INSIDE US market hours:
  # 14:30-19:30 UTC = 10:30 AM - 3:30 PM ET (Mon-Fri only, never after close)
  schedule:
    - cron: '30 14-19 * * 1-5'
  workflow_dispatch:

jobs:
  intraday_cycle:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Intraday 15m H.A.T.S Cycle (market hours only)
      env:
        PYTHONPATH: .
        TZ: America/New_York
        APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
        APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        ALPACA_PAPER: "1"
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # No --force flag: is_market_open() check in main.py will skip gracefully
        # if somehow cron fires slightly outside market hours (e.g. holiday)
        python -m src.main --interval 15m
