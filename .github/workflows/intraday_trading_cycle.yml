name: Automated Intraday Trading Cycle (Hourly)

on:
  # Runs every hour during US Market Hours (14:00 to 20:00 UTC / 10:00 AM to 4:00 PM ET, Mon-Fri)
  schedule:
    - cron: '30 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  intraday_cycle:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Intraday 15m/1h H.A.T.S Cycle
      env:
        PYTHONPATH: .
        TZ: America/New_York
        APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
        APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        ALPACA_PAPER: "1"
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python -m src.main --interval 15m --force
