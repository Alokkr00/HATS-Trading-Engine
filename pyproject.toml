[project]
name = "hats-trading-engine"
version = "1.0.0"
description = "Algorithmic trading engine and risk management framework for US equities & options (Alpaca API)"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "yfinance>=0.2.30",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "alpaca-py>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "sqlalchemy>=2.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "requests>=2.31.0",
    "google-genai>=0.1.0",
    "langgraph>=0.2.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
all = [
    "hats-trading-engine[dev]",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*copy_on_write.*",
    "ignore:.*starlette.testclient.*",
    "ignore:.*EmbeddingFunction.*:DeprecationWarning",
    "ignore:.*websockets.*:DeprecationWarning",
]
