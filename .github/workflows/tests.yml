name: Run Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyTest
      env:
        PYTHONPATH: .
        APCA_API_KEY_ID: mock_key_id_for_ci_testing
        APCA_API_SECRET_KEY: mock_secret_key_for_ci_testing
        ALPACA_PAPER: "1"
        GEMINI_API_KEY: mock_gemini_key_for_ci
        DASHBOARD_USERNAME: admin
        DASHBOARD_PASSWORD: hats_secure_pass
        TELEGRAM_BOT_TOKEN: mock_token_for_ci
        TELEGRAM_CHAT_ID: mock_chat_id_for_ci
      run: |
        pytest -v
