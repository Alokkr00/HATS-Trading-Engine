version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - hats-data:/app/data
    environment:
      - TZ=America/New_York
      - APCA_API_KEY_ID=${APCA_API_KEY_ID:-mock_key_id}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY:-mock_secret_key}
      - ALPACA_PAPER=${ALPACA_PAPER:-1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_gemini_key}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-hats_secure_pass}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    volumes:
      - hats-db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=hats_trading
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hats_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  hats-data:
  hats-db:
